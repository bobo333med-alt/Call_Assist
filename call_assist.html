<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Call-Assist | AI Call Center</title>

<!-- روابط مكتبات Firebase الصحيحة -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<style>
:root {
  --bg: #0f172a; --panel: #1e293b; --border: rgba(255,255,255,0.1);
  --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --purple: #8b5cf6; --text: #f8fafc;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--panel); border-bottom: 1px solid var(--border); gap: 8px; }
.btn { padding: 8px 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; color: white; transition: 0.2s; }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-start { background: var(--success); }
.btn-end { background: var(--danger); }
.btn-memory { background: #475569; }
.btn-auto { background: var(--purple); }
.panel-box { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow-y: auto; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: white; font-size: 14px; outline: none; }
.chat-area { flex: 1; min-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; }
.msg { padding: 8px 12px; border-radius: 8px; font-size: 14px; max-width: 85%; line-height: 1.5; }
.msg-ai { align-self: flex-start; background: rgba(59, 130, 246, 0.2); border-right: 3px solid var(--primary); }
.msg-user { align-self: flex-end; background: rgba(255,255,255,0.08); border-left: 3px solid #94a3b8; }
.input-row { display: flex; gap: 8px; padding: 10px; background: var(--panel); border-top: 1px solid var(--border); }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 15px; }
.modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th, td { padding: 8px; text-align: right; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>

<div id="authScreen" style="position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; justify-content:center; align-items:center; flex-direction:column; gap:10px;">
  <h2 style="color:var(--primary);">تسجيل الدخول للمنصة</h2>
  <input type="email" id="email" placeholder="البريد الإلكتروني" style="width:260px;">
  <input type="password" id="password" placeholder="كلمة المرور" style="width:260px;" onkeydown="if(event.key==='Enter') login()">
  <button id="loginBtn" class="btn btn-start" onclick="login()" style="width:260px; padding:12px;">دخول</button>
</div>

<div id="appScreen" style="display:none; height:100%; flex-direction:column;">
  <div class="top-bar">
    <div style="font-weight:bold; color:#38bdf8;">🤖 وكيل مركز النداء الذكي</div>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button class="btn btn-memory" onclick="toggleModal('memoryModal')">🧠 ذاكرة الشركة</button>
      <button class="btn btn-auto" onclick="toggleModal('leadsModal')">📋 الحرفاء والنتائج</button>
      <button class="btn btn-end" onclick="auth.signOut()">خروج</button>
    </div>
  </div>

  <div class="panel-box">
    <div class="card" style="text-align:center;">
      <div id="statusText" style="color:#fbbf24; font-weight:bold; font-size:14px;">الوكيل جاهز للعمل</div>
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-auto" id="btnCampaign" onclick="startCampaign()">🚀 بدء الاتصال الآلي بالحرفاء</button>
        <button class="btn btn-start" id="btnCall" onclick="startCall(null)">📞 مكالمة حية (صوت ونص)</button>
        <button class="btn btn-end" id="btnStop" style="display:none;" onclick="stopCall(true)">🛑 إنهاء المكالمة</button>
      </div>
    </div>

    <div class="chat-area" id="chatBox"></div>
  </div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="تحدث بصوتك أو اكتب هنا كأنك الحريف..." onkeypress="if(event.key==='Enter') sendText()">
    <button class="btn btn-start" onclick="sendText()">إرسال</button>
  </div>
</div>

<!-- نافذة ذاكرة الشركة -->
<div class="modal" id="memoryModal">
  <div class="modal-content">
    <h3>🧠 معلومات الشركة وتعليمات الوكيل</h3>
    <input type="text" id="agentName" placeholder="اسم الوكيل (مثال: سارة)">
    <textarea id="memoryText" style="height:150px;" placeholder="اكتب هنا منتجات الشركة، الأسعار، وطريقة الإقناع..."></textarea>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn btn-memory" onclick="toggleModal('memoryModal')">إغلاق</button>
      <button class="btn btn-start" onclick="saveMemory()">حفظ</button>
    </div>
  </div>
</div>

<!-- نافذة الحرفاء والنتائج -->
<div class="modal" id="leadsModal">
  <div class="modal-content" style="max-height:85vh; overflow-y:auto;">
    <h3>📋 قائمة الحرفاء للاتصال الآلي</h3>
    <input type="text" id="leadName" placeholder="اسم الحريف">
    <input type="tel" id="leadPhone" placeholder="رقم الهاتف (مثال: +21650000000)">
    <button class="btn btn-start" onclick="addLead()">➕ إضافة للقائمة</button>
    <table>
      <thead><tr><th>الحريف</th><th>الحالة</th><th>النتيجة</th></tr></thead>
      <tbody id="leadsTable"></tbody>
    </table>
    <button class="btn btn-memory" onclick="toggleModal('leadsModal')">إغلاق</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCCp08HOuP4vpXlvBkzjOgGAwQoeTsOKJ8",
  authDomain: "chat-core-app.firebaseapp.com",
  projectId: "chat-core-app",
  storageBucket: "chat-core-app.firebasestorage.app",
  messagingSenderId: "216958872856",
  appId: "1:216958872856:web:f03d559611b327c91b426d"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const API_URL = "https://call-assist-ibj6.onrender.com";

let agentName = "سارة";
let companyMemory = "";
let history = [];
let isCallActive = false;
let isCampaign = false;
let currentLead = null;
let recognition = null;
let isSpeaking = false;

function login() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  if (!email || !pass) return alert("يرجى إدخال البريد وكلمة المرور");

  btn.disabled = true;
  btn.textContent = "جاري الدخول...";

  auth.signInWithEmailAndPassword(email, pass)
    .catch(e => alert("خطأ في الدخول: " + e.message))
    .finally(() => {
      btn.disabled = false;
      btn.textContent = "دخول";
    });
}

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'flex';
    loadMemory();
    listenLeads();
    initVoice();
  } else {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
  }
});

function toggleModal(id) {
  const m = document.getElementById(id);
  m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
}

async function loadMemory() {
  const doc = await db.collection('settings').doc('company_memory').get();
  if (doc.exists) {
    companyMemory = doc.data().content || "";
    agentName = doc.data().agentName || "سارة";
    document.getElementById('memoryText').value = companyMemory;
    document.getElementById('agentName').value = agentName;
  }
}

async function saveMemory() {
  companyMemory = document.getElementById('memoryText').value;
  agentName = document.getElementById('agentName').value || "سارة";
  await db.collection('settings').doc('company_memory').set({ content: companyMemory, agentName }, { merge: true });
  toggleModal('memoryModal');
  alert("✅ تم حفظ معلومات الشركة");
}

async function addLead() {
  const name = document.getElementById('leadName').value.trim();
  const phone = document.getElementById('leadPhone').value.trim();
  if (!name || !phone) return alert("يرجى إدخال الاسم ورقم الهاتف");
  await db.collection('leads').add({
    name,
    phone,
    status: 'pending',
    summary: '-',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  document.getElementById('leadName').value = "";
  document.getElementById('leadPhone').value = "";
}

function listenLeads() {
  db.collection('leads').orderBy('createdAt', 'desc').onSnapshot(snap => {
    const tbody = document.getElementById('leadsTable');
    tbody.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      const statusText = d.status === 'completed' ? '✅ تم الاتصال' : '⏳ في الانتظار';
      tbody.innerHTML += `<tr><td>${d.name}</td><td>${statusText}</td><td>${d.summary || '-'}</td></tr>`;
    });
  });
}

function addMsg(role, text) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'ai' ? 'msg-ai' : 'msg-user');
