<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call-Assist | Agent App</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #0f172a; --panel: rgba(30, 41, 59, 0.7); --border: rgba(255,255,255,0.1);
  --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --text: #f8fafc;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Top Bar */
.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--panel); border-bottom: 1px solid var(--border); }
.timer-box { font-size: 20px; font-weight: bold; font-variant-numeric: tabular-nums; color: #fbbf24; }
.cost-box { font-size: 14px; color: #94a3b8; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
.btn-start { background: var(--success); color: white; }
.btn-end { background: var(--danger); color: white; display: none; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Split Screen */
.split-view { display: flex; flex: 1; gap: 10px; padding: 10px; height: calc(100vh - 140px); }
.side { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; padding: 15px; }
.side-header { text-align: center; font-weight: bold; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); color: #94a3b8; }
.chat-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px; border-radius: 8px; font-size: 15px; line-height: 1.5; }
.msg-original { background: rgba(255,255,255,0.05); border-right: 3px solid #64748b; }
.msg-translated { background: rgba(59, 130, 246, 0.1); border-right: 3px solid var(--primary); color: #93c5fd; }

/* Editor (Zero-Data Loss) */
.editor-area { display: none; margin-top: 10px; background: #000; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
.editor-area textarea { width: 100%; height: 60px; background: transparent; border: none; color: white; resize: none; outline: none; font-size: 14px; }
.editor-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 5px; }
.btn-send { background: var(--primary); color: white; padding: 5px 15px; font-size: 12px; }
.btn-cancel { background: transparent; color: #94a3b8; border: 1px solid #475569; padding: 5px 15px; font-size: 12px; }

/* Bottom Controls */
.controls { padding: 15px; background: var(--panel); border-top: 1px solid var(--border); display: flex; justify-content: center; align-items: center; gap: 20px; }
.mic-btn { width: 70px; height: 70px; border-radius: 50%; border: none; background: #334155; color: white; font-size: 24px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.mic-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
.mic-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }

/* Company Memory */
.memory-btn { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
.memory-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
.memory-content { background: var(--panel); padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid var(--border); }
.memory-content textarea { width: 100%; height: 200px; background: #000; color: white; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 10px; resize: none; }

@media (max-width: 768px) {
  .split-view { flex-direction: column; }
  .side { height: 50%; }
}
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="authScreen" style="position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; justify-content:center; align-items:center; flex-direction:column;">
  <h2 style="margin-bottom:20px; color:var(--primary);">Call-Assist Agent Login</h2>
  <input type="email" id="email" placeholder="Email" style="padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #334155; background:#000; color:white; width:250px;">
  <input type="password" id="password" placeholder="Password" style="padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #334155; background:#000; color:white; width:250px;">
  <button class="btn btn-start" onclick="login()" style="width:250px;">Login</button>
</div>

<!-- Main App -->
<div id="appScreen" style="display:none; height:100%;">
  <div class="top-bar">
    <div>
      <div class="timer-box" id="timerDisplay">00:00</div>
      <div class="cost-box" id="costDisplay">0.00 $</div>
    </div>
    <div>
      <button class="btn btn-start" id="startCallBtn" onclick="startCall()">بدء المكالمة</button>
      <button class="btn btn-end" id="endCallBtn" onclick="endCall()">إنهاء</button>
    </div>
    <button class="memory-btn" onclick="toggleMemory()">🧠 ذاكرة الشركة</button>
  </div>

  <div class="split-view">
    <!-- Agent Side -->
    <div class="side">
      <div class="side-header">الوكيل (أنت) - <span id="agentLangLabel">AR</span></div>
      <div class="chat-area" id="agentChat"></div>
    </div>
    <!-- Customer Side -->
    <div class="side">
      <div class="side-header">العميل - <span id="customerLangLabel">DE</span></div>
      <div class="chat-area" id="customerChat"></div>
    </div>
  </div>

  <!-- Editor Overlay -->
  <div style="position:absolute; bottom:100px; left:50%; transform:translateX(-50%); width:80%; max-width:600px;" id="editorContainer" class="editor-area">
    <div style="font-size:12px; color:#94a3b8; margin-bottom:5px;">عدّل النص قبل الترجمة (Zero-Data Loss):</div>
    <textarea id="textEditor"></textarea>
    <div class="editor-actions">
      <button class="btn btn-cancel" onclick="cancelEdit()">إلغاء</button>
      <button class="btn btn-send" onclick="sendForTranslation()">ترجمة وإرسال</button>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <select id="agentLang" style="padding:10px; border-radius:8px; background:#000; color:white; border:1px solid #334155;">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>
    
    <button class="mic-btn" id="pttBtn" onmousedown="startPTT()" onmouseup="stopPTT()" ontouchstart="startPTT()" ontouchend="stopPTT()" disabled>🎤</button>
    
    <select id="customerLang" style="padding:10px; border-radius:8px; background:#000; color:white; border:1px solid #334155;">
      <option value="de">Deutsch</option>
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>
  </div>
</div>

<!-- Memory Modal -->
<div class="memory-modal" id="memoryModal">
  <div class="memory-content">
    <h3 style="margin-bottom:10px;">🧠 ذاكرة الشركة (Company Memory)</h3>
    <p style="font-size:12px; color:#94a3b8; margin-bottom:10px;">هذه المعلومات تُرسل للذكاء الاصطناعي مع كل ترجمة لضمان الدقة.</p>
    <textarea id="memoryText" placeholder="أدخل سياسات الشركة، أسماء المنتجات، أو أي مصطلحات خاصة..."></textarea>
    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button class="btn btn-cancel" onclick="toggleMemory()">إغلاق</button>
      <button class="btn btn-start" onclick="saveMemory()">حفظ</button>
    </div>
  </div>
</div>

<script>
// ================= CONFIG =================
const firebaseConfig = {
  apiKey: "AIzaSyCCp08HOuP4vpXlvBkzjOgGAwQoeTsOKJ8",
  authDomain: "chat-core-app.firebaseapp.com",
  projectId: "chat-core-app",
  storageBucket: "chat-core-app.firebasestorage.app",
  messagingSenderId: "216958872856",
  appId: "1:216958872856:web:f03d559611b327c91b426d"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const API_URL = "https://call-assist-ibj6.onrender.com"; // رابط Render الخاص بك

// ================= STATE =================
let currentUser = null;
let currentCallId = null;
let callInterval = null;
let callStartTime = null;
let pricePerMinute = 0.50; // سيتم جلبها من Firebase لاحقاً
let companyMemory = "";
let recognition = null;
let isRecording = false;

// ================= AUTH =================
function login() {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email, pass).catch(err => alert(err.message));
}

auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    loadCompanyMemory();
    initSpeechRecognition();
  } else {
    currentUser = null;
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
  }
});

// ================= SPEECH RECOGNITION (STT) =================
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("متصفحك لا يدعم التعرف على الصوت. استخدم Chrome.");
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  
  recognition.onresult = (event) => {
    let finalTranscript = '';
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript;
      }
    }
    if (finalTranscript) {
      document.getElementById('textEditor').value += finalTranscript + ' ';
    }
  };

  recognition.onerror = (event) => {
    console.error("Speech error", event.error);
    stopPTT();
  };
}

// ================= PUSH-TO-TALK =================
function startPTT() {
  if (!currentCallId) return alert("ابدأ المكالمة أولاً");
  if (isRecording) return;
  
  isRecording = true;
  document.getElementById('pttBtn').classList.add('recording');
  
  // إعداد محرر النص
  const editorContainer = document.getElementById('editorContainer');
  editorContainer.style.display = 'block';
  document.getElementById('textEditor').value = "";
  
  // بدء التسجيل
  const lang = document.getElementById('agentLang').value;
  recognition.lang = lang === 'ar' ? 'ar-SA' : (lang === 'fr' ? 'fr-FR' : 'en-US');
  recognition.start();
}

function stopPTT() {
  if (!isRecording) return;
  isRecording = false;
  document.getElementById('pttBtn').classList.remove('recording');
  recognition.stop();
}

function cancelEdit() {
  document.getElementById('editorContainer').style.display = 'none';
  document.getElementById('textEditor').value = "";
}

// ================= TRANSLATION & AI =================
async function sendForTranslation() {
  const text = document.getElementById('textEditor').value.trim();
  if (!text) return cancelEdit();

  const sourceLang = document.getElementById('agentLang').value;
  const targetLang = document.getElementById('customerLang').value;
  
  document.getElementById('editorContainer').style.display = 'none';
  
  // 1. عرض النص الأصلي في شاشة الوكيل
  addMessage('agentChat', text, 'msg-original', sourceLang);

  try {
    // 2. إرسال للخادم للترجمة
    const res = await fetch(`${API_URL}/ai/translate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text,
        source_lang: sourceLang,
        target_lang: targetLang,
        company_memory: companyMemory,
        mode: 'translate',
        provider: 'auto'
      })
    });
    const data = await res.json();
    
    // 3. عرض الترجمة في شاشة العميل
    if (data.translated) {
      addMessage('customerChat', data.translated, 'msg-translated', targetLang);
      speakText(data.translated, targetLang); // نطق الترجمة للعميل
      logTurnToFirestore(text, data.translated, sourceLang, targetLang);
    } else {
      alert("فشل الترجمة: " + JSON.stringify(data));
    }
  } catch (e) {
    console.error(e);
    alert("خطأ في الاتصال بالخادم");
  }
}

// TTS (Text-to-Speech)
function speakText(text, langCode) {
  if (!window.speechSynthesis) return;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langCode === 'ar' ? 'ar-SA' : (langCode === 'de' ? 'de-DE' : (langCode === 'fr' ? 'fr-FR' : 'en-US'));
  speechSynthesis.speak(utterance);
}

// ================= UI HELPERS =================
function addMessage(containerId, text, className, lang) {
  const container = document.getElementById(containerId);
  const div = document.createElement('div');
  div.className = `msg ${className}`;
  div.setAttribute('dir', 'auto');
  div.innerHTML = `<span style="font-size:10px; opacity:0.5; display:block; margin-bottom:3px;">${lang.toUpperCase()}</span>${text}`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ================= CALL TIMER & BILLING =================
function startCall() {
  document.getElementById('startCallBtn').style.display = 'none';
  document.getElementById('endCallBtn').style.display = 'block';
  document.getElementById('pttBtn').disabled = false;
  
  currentCallId = db.collection('calls').doc().id;
  callStartTime = Date.now();
  
  // حفظ بداية المكالمة في Firestore
  db.collection('calls').doc(currentCallId).set({
    agentId: currentUser.uid,
    startAt: firebase.firestore.FieldValue.serverTimestamp(),
    status: 'active'
  });

  callInterval = setInterval(() => {
    const diff = Date.now() - callStartTime;
    const mins = Math.floor(diff / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    document.getElementById('timerDisplay').textContent = 
      `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
    const cost = (diff / 60000) * pricePerMinute;
    document.getElementById('costDisplay').textContent = `${cost.toFixed(2)} $`;
  }, 1000);
}

async function endCall() {
  if (callInterval) clearInterval(callInterval);
  if (isRecording) stopPTT();
  
  document.getElementById('startCallBtn').style.display = 'block';
  document.getElementById('endCallBtn').style.display = 'none';
  document.getElementById('pttBtn').disabled = true;
  
  if (currentCallId) {
    const durationSec = Math.floor((Date.now() - callStartTime) / 1000);
    const totalCost = (durationSec / 60) * pricePerMinute;
    await db.collection('calls').doc(currentCallId).update({
      endAt: firebase.firestore.FieldValue.serverTimestamp(),
      durationSec: durationSec,
      totalCost: totalCost,
      status: 'completed'
    });
  }
  
  document.getElementById('timerDisplay').textContent = "00:00";
  document.getElementById('costDisplay').textContent = "0.00 $";
  currentCallId = null;
}

// ================= FIRESTORE LOGGING =================
function logTurnToFirestore(original, translated, srcLang, destLang) {
  if (!currentCallId) return;
  db.collection('calls').doc(currentCallId).collection('turns').add({
    original: original,
    translated: translated,
    sourceLang: srcLang,
    targetLang: destLang,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
}

// ================= COMPANY MEMORY =================
function toggleMemory() {
  const modal = document.getElementById('memoryModal');
  modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
}

async function loadCompanyMemory() {
  const doc = await db.collection('settings').doc('company_memory').get();
  if (doc.exists) {
    companyMemory = doc.data().content || "";
    document.getElementById('memoryText').value = companyMemory;
  }
}

async function saveMemory() {
  const text = document.getElementById('memoryText').value;
  await db.collection('settings').doc('company_memory').set({ content: text });
  companyMemory = text;
  toggleMemory();
  alert("تم حفظ ذاكرة الشركة.");
}
</script>
</body>
</html>
