
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call-Assist | Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: white; padding: 20px; }
  .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
  input, textarea, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #475569; background: #000; color: white; }
  button { background: #3b82f6; cursor: pointer; font-weight: bold; border: none; }
  button:hover { background: #2563eb; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 10px; text-align: right; border-bottom: 1px solid #334155; }
</style>
</head>
<body>
  <h1>لوحة تحكم المالك</h1>
  
  <div class="card">
    <h3>⚙️ الإعدادات العامة</h3>
    <label>سعر الدقيقة ($):</label>
    <input type="number" id="priceInput" step="0.01" value="0.50">
    <button onclick="savePricing()">حفظ السعر</button>
  </div>

  <div class="card">
    <h3>🧠 ذاكرة الشركة (مركزياً)</h3>
    <textarea id="memoryInput" rows="5"></textarea>
    <button onclick="saveGlobalMemory()">حفظ الذاكرة</button>
  </div>

  <div class="card">
    <h3>📊 سجل المكالمات</h3>
    <table id="callsTable">
      <thead><tr><th>التاريخ</th><th>الوكيل</th><th>المدة (ث)</th><th>التكلفة ($)</th><th>الحالة</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCCp08HOuP4vpXlvBkzjOgGAwQoeTsOKJ8", authDomain: "chat-core-app.firebaseapp.com", projectId: "chat-core-app", storageBucket: "chat-core-app.firebasestorage.app", messagingSenderId: "216958872856", appId: "1:216958872856:web:f03d559611b327c91b426d" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function loadData() {
  const mem = await db.collection('settings').doc('company_memory').get();
  if (mem.exists) document.getElementById('memoryInput').value = mem.data().content;
  const pr = await db.collection('settings').doc('pricing').get();
  if (pr.exists) document.getElementById('priceInput').value = pr.data().pricePerMinute;
  
  db.collection('calls').orderBy('startAt', 'desc').limit(20).onSnapshot(snap => {
    const tbody = document.querySelector('#callsTable tbody');
    tbody.innerHTML = '';
    snap.forEach(doc => {
      const d = doc.data();
      const date = d.startAt ? d.startAt.toDate().toLocaleString('ar') : 'غير محدد';
      tbody.innerHTML += `<tr><td>${date}</td><td>${d.agentId.slice(0,6)}</td><td>${d.durationSec || 0}</td><td>${(d.totalCost || 0).toFixed(2)}</td><td>${d.status}</td></tr>`;
    });
  });
}

async function savePricing() {
  await db.collection('settings').doc('pricing').set({ pricePerMinute: parseFloat(document.getElementById('priceInput').value) });
  alert("تم تحديث السعر");
}

async function saveGlobalMemory() {
  await db.collection('settings').doc('company_memory').set({ content: document.getElementById('memoryInput').value });
  alert("تم تحديث ذاكرة الشركة لجميع الوكلاء");
}

loadData();
</script>
</body>
</html>
