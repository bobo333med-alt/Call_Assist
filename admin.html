<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم مركز النداء الذكي | Admin</title>

<!-- روابط مكتبات Firebase الصحيحة -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<style>
:root {
  --bg: #0f172a; --panel: #1e293b; --border: rgba(255,255,255,0.1);
  --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --text: #f8fafc;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
.container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 15px 25px; border-radius: 12px; border: 1px solid var(--border); }
.grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }
.card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; }
.card h2 { font-size: 18px; color: #93c5fd; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
input, textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; font-size: 14px; }
textarea { height: 140px; resize: vertical; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; color: white; }
.btn-primary { background: var(--primary); }
.btn-success { background: var(--success); }
.btn-danger { background: var(--danger); }
.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); }
th { color: #94a3b8; font-weight: 600; }
.badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
.badge-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
.badge-completed { background: rgba(16, 185, 129, 0.2); color: #34d399; }
</style>
</head>
<body>

<div id="authBox" style="max-width: 350px; margin: 100px auto; background: var(--panel); padding: 25px; border-radius: 12px; border: 1px solid var(--border); text-align: center;">
  <h2 style="margin-bottom: 20px; color: var(--primary);">دخول صاحب المركز</h2>
  <input type="email" id="email" placeholder="البريد الإلكتروني" style="margin-bottom: 10px;">
  <input type="password" id="password" placeholder="كلمة المرور" style="margin-bottom: 15px;" onkeydown="if(event.key==='Enter') login()">
  <button id="loginBtn" class="btn btn-primary" style="width: 100%;" onclick="login()">تسجيل الدخول</button>
</div>

<div id="dashboard" class="container" style="display: none;">
  <div class="header">
    <div>
      <h1 style="font-size: 20px;">🤖 مركز التحكم في الوكيل الذكي</h1>
      <p style="font-size: 12px; color: #94a3b8;">إدارة المعرفة، الحملات الصادرة، وسجل المكالمات</p>
    </div>
    <button class="btn btn-danger" onclick="auth.signOut()">خروج</button>
  </div>

  <div class="grid">
    <!-- إعدادات عقل الوكيل -->
    <div class="card">
      <h2>🧠 إعدادات وتعليمات الوكيل (Knowledge Base)</h2>
      <div>
        <label>اسم الوكيل وشخصيته</label>
        <input type="text" id="agentName" placeholder="مثال: سارة - مستشارة مبيعات">
      </div>
      <div>
        <label>لهجة ولغة التحدث الأساسية</label>
        <select id="agentLang">
          <option value="ar-TN">العربية (دارجة تونسية مهذبة)</option>
          <option value="ar">العربية الفصحى المبسطة</option>
          <option value="fr">الفرنسية (Français)</option>
          <option value="en">الإنجليزية (English)</option>
        </select>
      </div>
      <div>
        <label>معلومات الشركة، العروض، الأسعار، وطريقة الإقناع</label>
        <textarea id="companyMemory" placeholder="اكتب هنا كل التفاصيل التي يجب أن يعرفها البوت ليجيب الحرفاء بدقة..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="saveAgentSettings()">💾 حفظ إعدادات الوكيل</button>
    </div>

    <!-- إضافة حرفاء للاتصال الآلي -->
    <div class="card">
      <h2>📞 قائمة الحرفاء للاتصال الآلي (Outbound Leads)</h2>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="leadName" placeholder="اسم الحريف">
        <input type="tel" id="leadPhone" placeholder="رقم الهاتف (مثال: +21650000000)">
      </div>
      <div>
        <label>ملاحظة خاصة بالحريف (اختياري)</label>
        <input type="text" id="leadNote" placeholder="مثال: مهتم بعرض الألياف البصرية">
      </div>
      <button class="btn btn-success" onclick="addLead()">➕ إضافة للقائمة</button>

      <div style="overflow-x: auto; max-height: 250px;">
        <table>
          <thead>
            <tr>
              <th>الحريف</th>
              <th>الهاتف</th>
              <th>الحالة</th>
              <th>ملخص النتيجة</th>
            </tr>
          </thead>
          <tbody id="leadsTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCCp08HOuP4vpXlvBkzjOgGAwQoeTsOKJ8",
  authDomain: "://firebaseapp.com",
  projectId: "chat-core-app",
  storageBucket: "chat-core-app.firebasestorage.app",
  messagingSenderId: "216958872856",
  appId: "1:216958872856:web:f03d559611b327c91b426d"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function login() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');

  if (!email || !pass) {
    return alert("يرجى إدخال البريد الإلكتروني وكلمة المرور");
  }

  btn.disabled = true;
  btn.textContent = "جاري الدخول...";

  auth.signInWithEmailAndPassword(email, pass)
    .catch(e => {
      alert("خطأ في الدخول: " + e.message);
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = "تسجيل الدخول";
    });
}

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    loadSettings();
    listenToLeads();
  } else {
    document.getElementById('authBox').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }
});

async function loadSettings() {
  try {
    const doc = await db.collection('settings').doc('company_memory').get();
    if (doc.exists) {
      const data = doc.data();
      document.getElementById('agentName').value = data.agentName || "";
      document.getElementById('agentLang').value = data.agentLang || "ar-TN";
      document.getElementById('companyMemory').value = data.content || "";
    }
  } catch (e) {
    console.error("Error loading settings:", e);
  }
}

async function saveAgentSettings() {
  const agentName = document.getElementById('agentName').value.trim();
  const agentLang = document.getElementById('agentLang').value;
  const content = document.getElementById('companyMemory').value.trim();
  
  try {
    await db.collection('settings').doc('company_memory').set({
      agentName,
      agentLang,
      content,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    alert("✅ تم تحديث عقل الوكيل بنجاح!");
  } catch (e) {
    alert("❌ خطأ أثناء الحفظ: " + e.message);
  }
}

async function addLead() {
  const name = document.getElementById('leadName').value.trim();
  const phone = document.getElementById('leadPhone').value.trim();
  const note = document.getElementById('leadNote').value.trim();
  if (!name || !phone) return alert("يرجى إدخال الاسم ورقم الهاتف");

  try {
    await db.collection('leads').add({
      name,
      phone,
      note,
      status: 'pending',
      summary: '-',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('leadName').value = "";
    document.getElementById('leadPhone').value = "";
    document.getElementById('leadNote').value = "";
  } catch (e) {
    alert("❌ خطأ أثناء الإضافة: " + e.message);
  }
}

function listenToLeads() {
  db.collection('leads').orderBy('createdAt', 'desc').onSnapshot(snap => {
    const tbody = document.getElementById('leadsTable');
    tbody.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      const badgeClass = d.status === 'completed' ? 'badge-completed' : 'badge-pending';
      const statusText = d.status === 'completed' ? 'تم الاتصال' : 'في الانتظار';
      tbody.innerHTML += `
        <tr>
          <td>${d.name || '-'}</td>
          <td dir="ltr" style="text-align: right;">${d.phone || '-'}</td>
          <td><span class="badge ${badgeClass}">${statusText}</span></td>
          <td>${d.summary || '-'}</td>
        </tr>
      `;
    });
  }, err => {
    console.error("Error listening to leads:", err);
  });
}
</script>
</body>
</html>
